<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo List</title>
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background-color: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .todo-container {
    background-color: #1e293b;
    padding: 20px 30px;
    border-radius: 12px;
    width: 420px;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  .input-section {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }

  input[type="text"], input[type="date"] {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: none;
    outline: none;
  }

  button {
    border: none;
    cursor: pointer;
    border-radius: 6px;
    padding: 8px 12px;
  }

  .add-btn {
    background-color: #ef4444;
    color: white;
  }

  .delete-all {
    background-color: #dc2626;
    color: white;
    margin-top: 10px;
    width: 100%;
  }

  .filter-section {
    margin-top: 10px;
    display: flex;
    justify-content: flex-start;
  }

  .filter-section select {
    background-color: #334155;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }

  th, td {
    text-align: left;
    padding: 8px;
  }

  tr {
    background-color: #334155;
    border-radius: 8px;
  }

  .completed {
    color: #22c55e;
    font-weight: bold;
    background-color: #1e3a8a;
    border-radius: 5px;
    padding: 2px 8px;
  }

  .pending {
    color: #facc15;
    font-weight: bold;
    background-color: #78350f;
    border-radius: 5px;
    padding: 2px 8px;
  }

  .action-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: white;
  }

  .check {
    color: #22c55e;
  }

  .delete {
    color: #ef4444;
  }
</style>
</head>
<body>

<div class="todo-container">
  <h1>Todo List</h1>

  <div class="input-section">
    <input type="text" id="taskInput" placeholder="Add a todo...">
    <input type="date" id="dateInput">
    <button class="add-btn" onclick="addTask()">+</button>
  </div>

  <div class="filter-section">
    <select id="filterSelect" onchange="filterTasks()">
      <option value="all">Filter: All</option>
      <option value="completed">Completed</option>
      <option value="pending">Pending</option>
    </select>
  </div>

  <table id="todoTable">
    <thead>
      <tr>
        <th>Task</th>
        <th>Due Date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="todoBody">
      <tr data-status="completed">
        <td>reading a book</td>
        <td>2025-10-17</td>
        <td><span class="completed">Completed</span></td>
        <td>
          <button class="action-btn check" onclick="markDone(this)">✔</button>
          <button class="action-btn delete" onclick="deleteTask(this)">✖</button>
        </td>
      </tr>
    </tbody>
  </table>

  <button class="delete-all" onclick="deleteAll()">Delete All</button>
</div>

<script>
  function addTask() {
    const task = document.getElementById('taskInput').value;
    const date = document.getElementById('dateInput').value;
    if (task === '' || date === '') {
      alert('Please fill in both fields!');
      return;
    }

    const table = document.getElementById('todoBody');
    const row = document.createElement('tr');
    row.setAttribute('data-status', 'pending');

    row.innerHTML = `
      <td>${task}</td>
      <td>${date}</td>
      <td><span class="pending">Pending</span></td>
      <td>
        <button class="action-btn check" onclick="markDone(this)">✔</button>
        <button class="action-btn delete" onclick="deleteTask(this)">✖</button>
      </td>
    `;

    table.appendChild(row);
    document.getElementById('taskInput').value = '';
    document.getElementById('dateInput').value = '';
    filterTasks();
  }

  function deleteTask(button) {
    button.closest('tr').remove();
  }

  function markDone(button) {
    const row = button.closest('tr');
    const statusCell = row.querySelector('td:nth-child(3) span');
    const currentStatus = row.getAttribute('data-status');

    if (currentStatus === 'completed') {
      row.setAttribute('data-status', 'pending');
      statusCell.textContent = 'Pending';
      statusCell.className = 'pending';
    } else {
      row.setAttribute('data-status', 'completed');
      statusCell.textContent = 'Completed';
      statusCell.className = 'completed';
    }

    filterTasks();
  }

  function deleteAll() {
    document.getElementById('todoBody').innerHTML = '';
  }

  function filterTasks() {
    const filter = document.getElementById('filterSelect').value;
    const rows = document.querySelectorAll('#todoBody tr');

    rows.forEach(row => {
      const status = row.getAttribute('data-status');
      if (filter === 'all' || status === filter) {
        row.style.display = '';
      } else {
        row.style.display = 'none';
      }
    });
  }
</script>

</body>
</html>
